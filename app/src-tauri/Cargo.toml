[package]
name = "ai-limit-monitor"
version = "0.1.0"
edition = "2021"
license = "MIT"

[workspace]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-notification = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", default-features = false, features = ["std", "clock"] }
limit-core = { path = "../../core", features = ["reqwest-http"] }

[profile.release]
opt-level = "s"
lto = true
strip = true
